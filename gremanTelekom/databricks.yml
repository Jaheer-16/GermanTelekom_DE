bundle:
  name: germantelekom

include:
  - resources/*.yml

variables:
  bronze_catalog:
    default: bronze_germantelekom
  silver_catalog:
    default: silver_germantelekom
  gold_catalog:
    default: gold_germantelekom
  schema:
    default: customer
  # schema used by the bronze/silver load notebooks (their tables live in dev_customer)
  customer_schema:
    default: dev_customer
  landing_path:
    default: /Volumes/landing_germantelekom/landing/customer_data/customers_day1.csv

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8a89b63e-f06a.cloud.databricks.com/>

  uat:
    workspace:
      host: https://dbc-8a89b63e-f06a.cloud.databricks.com/>

  prod:
    workspace:
      host: https://dbc-8a89b63e-f06a.cloud.databricks.com/>