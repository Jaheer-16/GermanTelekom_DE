resources:
  jobs:
    customer_medallion_job:
      name: "customer_medallion_pipeline_${bundle.target}"

      tasks:
        # 1. Bronze Ingestion Task
        - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/bronze_customerJob.py
            base_parameters:
              bronze_catalog: "bronze_germantelekom"
              schema: "dev_customer"
              landing_path: "/Volumes/bronze_germantelekom/dev_customer/landing/customers_day1.csv"

        # 2. Silver Cleansing & SCD2 Task
        - task_key: silver_task
          depends_on:
            - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/silver_customerJob.py
            base_parameters:
              bronze_catalog: "bronze_germantelekom"
              silver_catalog: "silver_germantelekom"
              schema: "dev_customer"
              source_file_name: "{{tasks.bronze_task.values.source_file_name}}"
